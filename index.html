<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk to Your Data</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; }
      h1 { margin-bottom: 0.25rem; }
      #status { color: #555; margin-top: 0; }
      .row { display: flex; gap: 0.5rem; margin: 0.75rem 0; }
      #question { flex: 1; padding: 0.5rem; font: inherit; }
      textarea { width: 100%; box-sizing: border-box; font: 13px/1.4 ui-monospace, monospace; padding: 0.5rem; min-height: 5rem; }
      button { padding: 0.5rem 1rem; font: inherit; cursor: pointer; }
      button:disabled { cursor: default; opacity: 0.5; }
      label { font-weight: 600; font-size: 0.85rem; color: #444; display: block; margin-top: 0.5rem; }
      #rationale { color: #555; font-style: italic; min-height: 1.2em; }
      #msg { color: #b00; min-height: 1.2em; white-space: pre-wrap; }
      table { border-collapse: collapse; margin-top: 0.75rem; font-size: 13px; }
      th, td { border: 1px solid #ddd; padding: 0.3rem 0.6rem; text-align: left; }
      th { background: #f4f4f4; }
      #empty { color: #777; margin-top: 0.75rem; }
    </style>
  </head>
  <body>
    <h1>Talk to Your Data</h1>
    <p id="status">Loading DuckDB-WASM…</p>

    <div class="row">
      <input id="question" type="text" placeholder="Ask a question in plain English…" disabled />
      <button id="generate" disabled>Generate SQL</button>
    </div>

    <div id="rationale"></div>

    <label for="sql">Generated SQL (editable)</label>
    <textarea id="sql" spellcheck="false" placeholder="SQL appears here — edit and re-run freely"></textarea>
    <div class="row">
      <button id="run" disabled>Run SQL</button>
    </div>

    <div id="msg"></div>
    <div id="results"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
